name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./paper_reproduction_agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install linter
        run: pip install ruff
      - name: Lint source
        run: ruff check src/

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./paper_reproduction_agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy pydantic pydantic-settings chromadb tiktoken
          pip install langchain-core langchain-google-genai langgraph
          pip install -e . --no-deps
      - name: Run unit tests
        run: pytest tests/ -v --ignore=tests/manual

[project]
name = "paper-reproduction-agent"
version = "0.1.0"
description = "Multi-agent system for reproducing and verifying academic paper implementations"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=1.0.5",
    "langchain>=1.2.3",
    "langchain-openai>=1.1.7",
    "langchain-anthropic>=0.3.21",
    "langchain-groq>=1.1.1",
    "langchain-google-genai>=4.1.3",
    "pypdf2>=3.0.1",
    "arxiv>=2.2.0",
    "requests>=2.32.5",
    "beautifulsoup4>=4.14.2",
    "pygithub>=2.8.1",
    "numpy>=1.26.4",
    "pandas>=2.3.3",
    "matplotlib>=3.10.7",
    "scikit-learn>=1.7.2",
    "torch>=2.8.0",
    "python-dotenv>=1.1.1",
    "google-generativeai>=0.8.6",
    "google-ai-generativelanguage>=0.6.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.7.0",
    "ruff>=0.14.0",
]

[build-system]
requires = ["setuptools>=79.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-reproduction-agent"
version = "0.1.0"
description = "Multi-agent system for reproducing and verifying academic paper implementations"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.69.0",
    "arxiv>=2.2.0",
    "beautifulsoup4>=4.14.2",
    "chromadb>=1.4.1",
    "click>=8.2.1",
    "ddgs>=9.10.0",
    "google-ai-generativelanguage>=0.6.15",
    "google-genai>=1.0.0",
    "google-generativeai>=0.8.6",
    "langchain>=1.2.3",
    "langchain-anthropic>=0.3.21",
    "langchain-community>=0.3.31",
    "langchain-core>=1.2.7",
    "langchain-google-genai>=4.1.3",
    "langgraph>=1.0.5",
    "langsmith>=0.4.33",
    "matplotlib>=3.10.7",
    "numpy>=1.26.4",
    "pandas>=2.3.3",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.11.0",
    "pygithub>=2.8.1",
    "pypdf2>=3.0.1",
    "python-dotenv>=1.1.1",
    "requests>=2.32.5",
    "rich>=14.2.0",
    "scikit-learn>=1.7.2",
    "tenacity>=9.1.2",
    "torch>=2.4.0",
    "tqdm>=4.67.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.7.0",
    "ruff>=0.14.0",
]

[build-system]
requires = ["setuptools>=79.0.1"]
build-backend = "setuptools.build_meta"

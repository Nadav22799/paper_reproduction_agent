[project]
name = "paper-reproduction-agent"
version = "0.1.0"
description = "Multi-agent system for reproducing and verifying academic paper implementations"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.2.0",
    "langchain-groq>=0.1.0",
    "pypdf2>=3.0.0",
    "arxiv>=2.1.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "pygithub>=2.1.1",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "scikit-learn>=1.3.0",
    "torch>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.7.0",
    "ruff>=0.0.285",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
